<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAFA;--card:#FFF;--text:#2D3748;--muted:#718096;--accent:#4A5568;--line:rgba(45,55,72,.1)}
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:800px;background:var(--bg);font-family:Inter,system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;gap:56px;padding:90px;color:var(--text)}
  .panel{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 32px;
         box-shadow:0 14px 40px rgba(45,55,72,.07)}
  .label{font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .bubble{background:#EEF1F6;border-radius:16px 16px 16px 5px;padding:20px 22px;font-family:'JetBrains Mono',ui-monospace,monospace;
          font-size:19px;line-height:1.75;color:var(--text)}
  .bubble .side{color:#2F855A;font-weight:500}
  .meta{margin-top:16px;font-size:14px;color:var(--muted)}
  .row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500}
  .arrow{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
  .arrow .t{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
</style></head>
<body>
  <div class="panel">
    <div class="label">Telegram</div>
    <div class="bubble"><span class="side">BUY</span> EURUSD @ 1.0842<br>SL 1.0820<br>TP 1.0890 / 1.0925</div>
    <div class="meta">Free-form text from a signal channel. Every provider writes it differently.</div>
  </div>
  <div class="arrow">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <div class="t">parsed</div>
  </div>
  <div class="panel">
    <div class="label">MetaTrader order</div>
    <div class="row"><span>Symbol</span><span>EURUSD</span></div>
    <div class="row"><span>Type</span><span>BUY</span></div>
    <div class="row"><span>Entry</span><span>1.0842</span></div>
    <div class="row"><span>Stop loss</span><span>1.0820</span></div>
    <div class="row"><span>Take profit</span><span>1.0890 · 1.0925</span></div>
    <div class="meta">Placed on the terminal, with the risk sized before it goes.</div>
  </div>
</body></html>
